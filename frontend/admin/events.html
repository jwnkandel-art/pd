<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Events | NexaAI</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <script>
    window.NEXAAI_BACKEND_URL = 'https://pd-three-chi.vercel.app';
  </script>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="dashboard.html" class="nav-logo"><div class="logo-mark">N</div><span>NexaAI</span></a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="articles.html">Articles</a></li>
      <li><a href="events.html" class="active">Events</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="dashboard show" id="dashboard">
  <div class="dashboard-header">
    <div>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.08em;">Admin Panel</p>
      <h2>Events Management</h2>
    </div>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <!-- <span id="adminUserLabel" style="font-size:0.9rem; color:var(--text-muted);">Signed in</span> -->
      <button id="logoutBtn" class="btn btn-dark btn-sm">Sign Out</button>
    </div>
  </div>

  <div class="admin-table-wrap" style="margin-bottom:24px;">
    <div class="admin-table-header">
      <h3>Create or edit event</h3>
      <!-- <span style="font-size:0.82rem; color:var(--text-muted);">Saved to Firestore through the existing events API</span> -->
    </div>
    <form id="eventForm" style="display:grid; gap:12px; padding:24px;">
      <input type="hidden" id="eventId" />
      <input id="eventTitle" type="text" placeholder="Event title" required style="padding:12px; border:1px solid #d8dce5; border-radius:10px;" />
      <input id="eventLocation" type="text" placeholder="Location" style="padding:12px; border:1px solid #d8dce5; border-radius:10px;" />
      <input id="eventDate" type="date" required style="padding:12px; border:1px solid #d8dce5; border-radius:10px;" />
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <input id="eventStartTime" type="time" style="padding:12px; border:1px solid #d8dce5; border-radius:10px;" />
        <input id="eventEndTime" type="time" style="padding:12px; border:1px solid #d8dce5; border-radius:10px;" />
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <select id="eventMode" style="padding:12px; border:1px solid #d8dce5; border-radius:10px;">
          <option value="In Person">In Person</option>
          <option value="Virtual">Virtual</option>
          <option value="Hybrid">Hybrid</option>
        </select>
        <select id="eventStatus" style="padding:12px; border:1px solid #d8dce5; border-radius:10px;">
          <option value="Scheduled">Scheduled</option>
          <option value="Cancelled">Cancelled</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <label style="display:flex; align-items:center; gap:8px; color:var(--text-muted);">
        <input id="eventFeatured" type="checkbox" />
        Featured event
      </label>
      <textarea id="eventDescription" rows="4" placeholder="Description" style="padding:12px; border:1px solid #d8dce5; border-radius:10px;"></textarea>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button type="submit" class="btn btn-dark">Save Event</button>
        <button type="button" id="cancelEventEdit" class="btn">Cancel</button>
      </div>
      <div id="eventMessage" style="display:none; padding:10px 12px; border-radius:10px; background:#f7f9fc;"></div>
    </form>
  </div>

  <div class="admin-table-wrap">
    <div class="admin-table-header">
      <h3>Saved events</h3>
      <span style="font-size:0.82rem; color:var(--text-muted);">Click an item to edit it</span>
    </div>
    <div id="eventList" style="padding:24px;"></div>
    <div id="eventPagination" style="padding:12px 24px; border-top:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
      <button type="button" id="eventPrevPage" class="btn btn-sm" style="padding:6px 12px;">← Previous</button>
      <span id="eventPageInfo" style="font-size:0.85rem; color:var(--text-muted);">Page 1</span>
      <button type="button" id="eventNextPage" class="btn btn-sm" style="padding:6px 12px;">Next →</button>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
  const backendBase = (window.NEXAAI_BACKEND_URL || 'https://pd-three-chi.vercel.app').replace(/\/$/, '');
  const eventForm = document.getElementById('eventForm');
  const eventIdInput = document.getElementById('eventId');
  const eventTitleInput = document.getElementById('eventTitle');
  const eventLocationInput = document.getElementById('eventLocation');
  const eventDateInput = document.getElementById('eventDate');
  const eventStartTimeInput = document.getElementById('eventStartTime');
  const eventEndTimeInput = document.getElementById('eventEndTime');
  const eventModeInput = document.getElementById('eventMode');
  const eventStatusInput = document.getElementById('eventStatus');
  const eventFeaturedInput = document.getElementById('eventFeatured');
  const eventDescriptionInput = document.getElementById('eventDescription');
  const eventMessage = document.getElementById('eventMessage');
  const eventList = document.getElementById('eventList');
  const cancelEventEdit = document.getElementById('cancelEventEdit');

  function showEventMessage(message, isError = false) {
    eventMessage.style.display = 'block';
    eventMessage.textContent = message;
    eventMessage.style.background = isError ? '#fff2f2' : '#f2fbf4';
    eventMessage.style.color = isError ? '#b42318' : '#027a48';
  }

  function resetEventForm() {
    eventForm.reset();
    eventIdInput.value = '';
    eventStatusInput.value = 'Scheduled';
    eventModeInput.value = 'In Person';
    eventMessage.style.display = 'none';
  }

  let eventCurrentPage = 1;
  let eventItemsPerPage = 10;
  let eventAllData = [];

  function displayEventPage() {
    const start = (eventCurrentPage - 1) * eventItemsPerPage;
    const end = start + eventItemsPerPage;
    const pageData = eventAllData.slice(start, end);
    const totalPages = Math.ceil(eventAllData.length / eventItemsPerPage);

    if (!pageData.length) {
      eventList.innerHTML = '<p style="color:var(--text-muted);">No events yet.</p>';
    } else {
      eventList.innerHTML = pageData.map(event => `
        <div style="border:1px solid #e5e7eb; border-radius:14px; padding:16px; margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px;">
            <strong>${event.title || 'Untitled event'}</strong>
            <span style="font-size:0.85rem; color:var(--text-muted);">${event.status || 'Scheduled'}</span>
          </div>
          <p style="margin:6px 0; color:var(--text-muted);">${event.eventDate || 'TBD'}${event.location ? ' • ' + event.location : ''}</p>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button type="button" class="btn btn-sm" data-edit-event="${event.id}">Edit</button>
            <button type="button" class="btn btn-sm" style="background:#fee2e2; color:#b42318; border:1px solid #fca5a5;" data-delete-event="${event.id}"><i class="bi bi-trash"></i> Delete</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('eventPageInfo').textContent = `Page ${eventCurrentPage} of ${totalPages}`;
    document.getElementById('eventPrevPage').disabled = eventCurrentPage === 1;
    document.getElementById('eventNextPage').disabled = eventCurrentPage === totalPages || totalPages === 0;
  }

  async function loadEvents() {
    eventList.innerHTML = '<p style="color:var(--text-muted);">Loading…</p>';
    try {
      const response = await fetch(`${backendBase}/api/events`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Unable to load events.');
      eventAllData = Array.isArray(data) ? data : [];
      eventCurrentPage = 1;
      displayEventPage();
    } catch (error) {
      eventList.innerHTML = `<p style="color:#b42318;">${error.message}</p>`;
    }
  }

  eventForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const payload = {
      title: eventTitleInput.value.trim(),
      location: eventLocationInput.value.trim(),
      eventDate: eventDateInput.value,
      startTime: eventStartTimeInput.value,
      endTime: eventEndTimeInput.value,
      mode: eventModeInput.value,
      featured: eventFeaturedInput.checked,
      description: eventDescriptionInput.value.trim(),
      status: eventStatusInput.value,
    };

    if (!payload.title || !payload.eventDate) {
      showEventMessage('Title and date are required.', true);
      return;
    }

    try {
      const method = eventIdInput.value ? 'PATCH' : 'POST';
      const url = eventIdInput.value ? `${backendBase}/api/events/${eventIdInput.value}` : `${backendBase}/api/events`;
      const response = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Unable to save event.');
      showEventMessage(data.message || 'Event saved successfully.');
      resetEventForm();
      loadEvents();
    } catch (error) {
      showEventMessage(error.message, true);
    }
  });

  cancelEventEdit.addEventListener('click', resetEventForm);
  eventList.addEventListener('click', async (event) => {
    // Handle Edit button
    const editButton = event.target.closest('[data-edit-event]');
    if (editButton) {
      const id = editButton.getAttribute('data-edit-event');
      try {
        const response = await fetch(`${backendBase}/api/events/${id}`);
        const eventData = await response.json();
        if (!response.ok) throw new Error(eventData.message || 'Unable to load event.');
        eventIdInput.value = eventData.id;
        eventTitleInput.value = eventData.title || '';
        eventLocationInput.value = eventData.location || '';
        eventDateInput.value = eventData.eventDate ? eventData.eventDate.split('T')[0] : '';
        eventStartTimeInput.value = eventData.startTime || '';
        eventEndTimeInput.value = eventData.endTime || '';
        eventModeInput.value = eventData.mode || 'In Person';
        eventStatusInput.value = eventData.status || 'Scheduled';
        eventFeaturedInput.checked = Boolean(eventData.featured);
        eventDescriptionInput.value = eventData.description || '';
        eventTitleInput.focus();
      } catch (error) {
        showEventMessage(error.message, true);
      }
      return;
    }

    // Handle Delete button
    const deleteButton = event.target.closest('[data-delete-event]');
    if (deleteButton) {
      const id = deleteButton.getAttribute('data-delete-event');
      if (!confirm('Are you sure you want to permanently delete this event?')) return;
      
      try {
        const response = await fetch(`${backendBase}/api/events/${id}`, {
          method: 'DELETE',
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Unable to delete event.');
        showEventMessage('Event deleted successfully.');
        loadEvents();
      } catch (error) {
        showEventMessage(error.message, true);
      }
    }
  });

  // Pagination handlers
  document.getElementById('eventPrevPage').addEventListener('click', () => {
    if (eventCurrentPage > 1) {
      eventCurrentPage--;
      displayEventPage();
    }
  });

  document.getElementById('eventNextPage').addEventListener('click', () => {
    const totalPages = Math.ceil(eventAllData.length / eventItemsPerPage);
    if (eventCurrentPage < totalPages) {
      eventCurrentPage++;
      displayEventPage();
    }
  });

  loadEvents();
</script>
</body>
</html>
